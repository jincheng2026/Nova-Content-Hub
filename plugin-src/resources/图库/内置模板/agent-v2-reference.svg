<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc"><title id="title">Agent工作流 · 原创换标题参考</title><desc id="desc">先看每一步再连成工作流。上方两行说明工作流目标。；中段四节点沿折线路径串联。；检查节点带暖色描边，出口标明产物。。原创矢量参考，未经过 AI 还原测试。</desc><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="900" height="1200" fill="#f1f1e7" /><text x="66" y="103" font-size="23" fill="#23453f" font-weight="700" >AGENT FLOW / 任务交接示意</text><text x="66" y="238" font-size="82" fill="#23453f" font-weight="750" >先看每一步</text><text x="66" y="342" font-size="82" fill="#23453f" font-weight="750" >再连成工作流</text><text x="66" y="405" font-size="24" fill="#23453f" font-weight="400" >流程示意 · 未连接实际工具或执行任务</text><path d="M397 602 H498 M660 678 V801 M501 880 H397" fill="none" stroke="#23453f" stroke-width="4"/><path d="M485 595 L498 602 L485 609 M653 788 L660 801 L667 788 M410 873 L397 880 L410 887" fill="none" stroke="#23453f" stroke-width="4"/><rect x="66" y="517" width="333" height="169" fill="#ffffff" rx="16" stroke="#c6d6bd" stroke-width="2"/><text x="90" y="559" font-size="16" fill="#23453f" font-weight="700" >01 / INPUT</text><text x="90" y="617" font-size="32" fill="#23453f" font-weight="700" >明确输入</text><text x="90" y="656" font-size="18" fill="#23453f" font-weight="400" >有依据的原始内容</text><rect x="501" y="517" width="333" height="169" fill="#ffffff" rx="16" stroke="#c6d6bd" stroke-width="2"/><text x="525" y="559" font-size="16" fill="#23453f" font-weight="700" >02 / PROCESS</text><text x="525" y="617" font-size="32" fill="#23453f" font-weight="700" >分步处理</text><text x="525" y="656" font-size="18" fill="#23453f" font-weight="400" >明确工具与处理步骤</text><rect x="501" y="796" width="333" height="169" fill="#fff8e9" rx="16" stroke="#da8a51" stroke-width="4"/><text x="525" y="838" font-size="16" fill="#23453f" font-weight="700" >03 / HUMAN CHECK</text><text x="525" y="896" font-size="32" fill="#23453f" font-weight="700" >确认依据</text><text x="525" y="935" font-size="18" fill="#23453f" font-weight="400" >确认事实与授权</text><rect x="66" y="796" width="333" height="169" fill="#ffffff" rx="16" stroke="#c6d6bd" stroke-width="2"/><text x="90" y="838" font-size="16" fill="#23453f" font-weight="700" >04 / DELIVERY</text><text x="90" y="896" font-size="32" fill="#23453f" font-weight="700" >输出结果</text><text x="90" y="935" font-size="18" fill="#23453f" font-weight="400" >保留来源与最终版本</text><rect x="66" y="1042" width="768" height="64" fill="#c6d6bd" rx="10"/><text x="88" y="1083" font-size="27" fill="#23453f" font-weight="700" >人工检查之后，再进入下一步。</text><text x="66" y="1160" font-size="16" fill="#23453f" font-weight="500" letter-spacing="1">原创换标题参考 · NOVA CONTENT HUB</text></g></svg>
