interface:
  display_name: 对标内容入库助手
  short_description: 把用户已选中的社媒内容、图片和视频去重、转写并保存到第二大脑素材库。
  default_prompt: 使用 $jc-benchmark-intake，把我复制的社媒作品信息和下载好的媒体完整保存到 02_内容素材，并完成去重、转写和严格检查。

compatibility:
  canonical_format: agent-skills
  adapter_targets:
    - claude
    - openai
    - generic
    - agent-skills-compatible
  trust:
    source_tier: local
    remote_inline_execution: forbid
    remote_metadata_policy: 只使用用户提供材料、本地媒体和项目文件，不执行远程代码。
  permissions:
    network: 不需要网络；除非用户另行提供公开图片 URL，不扩展采集范围。
    file_write: 只写 02_内容素材、入库检查报告和项目 .trash 中的可恢复转写中间版本。
    subprocess: 只运行本地媒体检查、火山引擎豆包语音转写、本地时间码字幕生成、Skill 校验和文件移动命令。
    interactive: 不需要交互式登录或授权。
  degradation:
    openai: 直接读取项目 SKILL.md 和本地资源执行。
    claude: 直接读取项目 SKILL.md 和本地资源执行。
    generic: 无 Skill 注入时按入库契约手动执行，但不得跳过校正版验收和最终清理。
    agent-skills-compatible: 使用项目真源作为规范入口。
