<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc"><title id="title">人物访谈 · 原创换标题参考</title><desc id="desc">听见经验也听见疑问。上方双行大字，右侧竖条提问标记。；左下半身剪影，右下引用卡。；单句引语与受访者角色，不杜撰姓名。。原创矢量参考，未经过 AI 还原测试。</desc><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="900" height="1200" fill="#efeee8" /><text x="66" y="106" font-size="23" fill="#242b32" font-weight="600" >IN CONVERSATION / 对话示例</text><text x="66" y="240" font-size="84" fill="#242b32" font-weight="750" >听见经验</text><text x="66" y="344" font-size="84" fill="#242b32" font-weight="750" >也听见疑问</text><text x="66" y="407" font-size="25" fill="#242b32" font-weight="400" >把一个答案，变成下一个问题</text><rect x="66" y="468" width="407" height="620" fill="#b9c8c4" /><path d="M94 1088 Q98 850 260 848 Q429 850 453 1088Z" fill="#242b32"/><ellipse cx="263" cy="715" rx="99" ry="124" fill="#efeee8"/><path d="M164 704 Q154 558 270 575 Q377 583 364 711 Q326 690 306 637 Q241 704 164 704Z" fill="#242b32"/><rect x="504" y="590" width="330" height="400" fill="#fffdf5" /><text x="530" y="655" font-size="88" fill="#e66a45" font-weight="800" >“</text><text x="530" y="708" font-size="28" fill="#242b32" font-weight="700" >关于创作</text><text x="530" y="750" font-size="28" fill="#242b32" font-weight="700" >先听一个回答</text><path d="M530 790 L808 790" fill="none" stroke="#b9c8c4" stroke-width="2" /><text x="530" y="840" font-size="21" fill="#242b32" font-weight="600" >“把为什么再问一遍”</text><text x="530" y="900" font-size="17" fill="#242b32" font-weight="400" >对话栏目 / 虚构示例</text><text x="529" y="1050" font-size="18" fill="#242b32" font-weight="400" >人物为原创无身份剪影</text><text x="66" y="1160" font-size="16" fill="#242b32" font-weight="500" letter-spacing="1">原创换标题参考 · NOVA CONTENT HUB</text></g></svg>
