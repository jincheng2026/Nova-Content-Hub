<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc"><title id="title">生活场景 · 原创设计原图</title><desc id="desc">周末的光落在书页上。左上短标题置于奶油纸底。；中下部斜放大幅窗边桌面画框。；右下小便笺仅一条感受。。原创矢量参考，未经过 AI 还原测试。</desc><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="900" height="1200" fill="#f4eadc" /><text x="66" y="106" font-size="23" fill="#3b453f" font-weight="500" >A SMALL MOMENT / 日常片刻</text><text x="66" y="240" font-size="84" fill="#3b453f" font-weight="750" >周末的光</text><text x="66" y="344" font-size="84" fill="#3b453f" font-weight="750" >落在书页上</text><text x="66" y="407" font-size="24" fill="#3b453f" font-weight="400" >从窗边桌面，记录一个小片刻</text><g transform="rotate(-3 450 760)"><rect x="88" y="472" width="716" height="570" fill="#fffdf7" /><rect x="112" y="496" width="668" height="484" fill="#bbc9ad" /><rect x="112" y="496" width="668" height="260" fill="#dce1ce" /><rect x="510" y="520" width="210" height="222" fill="#eef0df" /><path d="M615 520 L615 742" fill="none" stroke="#a2b299" stroke-width="2" /><path d="M510 635 L720 635" fill="none" stroke="#a2b299" stroke-width="2" /><rect x="112" y="756" width="668" height="224" fill="#b78964" /><path d="M145 820 L454 820 L485 933 L176 933Z" fill="#f9f2dd"/><path d="M305 820 L330 933" stroke="#b96c4f" stroke-width="3"/><ellipse cx="598" cy="842" rx="60" ry="22" fill="#9c7156"/><path d="M552 777 H641 V838 Q594 863 552 838Z" fill="#fff5df"/><path d="M641 790 Q695 779 679 818 Q669 835 641 821" fill="none" stroke="#fff5df" stroke-width="14"/><text x="132" y="1018" font-size="19" fill="#3b453f" font-weight="400" >窗边桌面 / 原创插画</text></g><rect x="463" y="978" width="350" height="117" fill="#f8e8bc" transform="rotate(3 638 1036)"/><text x="485" y="1043" font-size="25" fill="#3b453f" font-weight="600" >今天先读一页</text><text x="66" y="1160" font-size="16" fill="#3b453f" font-weight="500" letter-spacing="1">原创设计原图 · NOVA CONTENT HUB</text></g></s