<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc"><title id="title">双栏对比 · 原创设计原图</title><desc id="desc">同一件小事换一种做法。左白右墨的双列卡片，把习惯做法和可尝试动作按行配对。原创矢量参考，未经过 AI 还原测试。</desc><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="900" height="1200" fill="#f6f6ed" /><rect x="450" y="0" width="450" height="1200" fill="#dbe9d4" /><text x="66" y="100" font-size="22" fill="#183a36" font-weight="700" letter-spacing="2">TWO WAYS TO THINK</text><text x="66" y="254" font-size="82" fill="#183a36" font-weight="750" >同一件小事</text><text x="66" y="359" font-size="82" fill="#183a36" font-weight="750" >换一种做法</text><text x="66" y="429" font-size="25" fill="#183a36" font-weight="400" >先看差异，再决定下一步</text><rect x="56" y="490" width="370" height="518" fill="#ffffff" rx="20"/><rect x="474" y="490" width="370" height="518" fill="#183a36" rx="20"/><text x="87" y="562" font-size="34" fill="#183a36" font-weight="700" >习惯做法</text><text x="506" y="562" font-size="34" fill="#ffffff" font-weight="700" >试着换一步</text><text x="87" y="611" font-size="18" fill="#737c80" font-weight="600" letter-spacing="3">BEFORE</text><text x="506" y="611" font-size="18" fill="#d5f978" font-weight="600" letter-spacing="3">AFTER</text><text x="87" y="704" font-size="27" fill="#183a36" font-weight="400" >想到哪写到哪</text><text x="506" y="704" font-size="27" fill="#ffffff" font-weight="400" >先列一个结构</text><text x="87" y="798" font-size="27" fill="#183a36" font-weight="400" >收集太多资料</text><text x="506" y="798" font-size="27" fill="#ffffff" font-weight="400" >先确认一个问题</text><text x="87" y="892" font-size="27" fill="#183a36" font-weight="400" >等灵感来</text><text x="506" y="892" font-size="27" fill="#ffffff" font-weight="400" >先写一小段</text><circle cx="450" cy="748" r="29" fill="#d5f978"/><text x="435" y="758" font-size="31" fill="#183a36" font-weight="700" >→</text><text x="66" y="1080" font-size="27" fill="#183a36" font-weight="600" >比较同一个维度，再做选择。</text><text x="66" y="1160" font-size="16" fill="#183a36" font-weight="500" letter-spacing="1">原创设计原图 · NOVA CONTENT HUB</text></g></svg>
