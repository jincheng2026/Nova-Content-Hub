<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Nova 内容库 · 技术验证</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head>
<body><main>
<p class="eyebrow">Nova 内容库 · 文件流程技术验证</p><h1>从旧工作台开始</h1>
<p>选择备份，检查数量，再导入到一个新内容库。导入中断后，下次打开可继续同一任务。</p>
<p class="notice">此入口仅验证本地导入与读取；正式授权和助手生成尚未接入。</p>
<section aria-labelledby="import-heading"><h2 id="import-heading">导入旧备份</h2>
<div class="actions"><button id="backup">选择旧备份</button><button id="destination">选择新库位置</button></div>
<p id="selection">正在读取机器绑定…</p><div id="preview"></div>
<div class="actions"><button id="import">导入并打开</button><button id="resume">继续导入</button><button id="refresh">查询状态</button><button id="list">查看内容</button></div>
<p id="status" role="status" aria-live="polite"></p><p id="error" role="alert"></p><ul id="issues"></ul></section>
<section aria-labelledby="content-heading"><h2 id="content-heading">内容列表</h2><div id="contents"><p>导入完成后可查看内容。</p></div></section>
</main></body></html>
