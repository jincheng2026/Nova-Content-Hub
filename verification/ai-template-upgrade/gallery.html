<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>自媒体内置模板 v3</title>
<style>* {
    box-sizing: border-box
}

body {
    margin: 0;
    padding: 30px;
    background: #f5f6f8;
    color: #202735;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif
}

h1 {
    margin: 0;
    font-size: 28px
}

header p {
    color: #586174;
    margin: 6px 0 24px
}

main {
    display: grid;
    grid-template-columns:repeat(6, minmax(0, 1fr));
    gap: 18px
}

article {
    margin: 0;
    min-width: 0
}

img {
    display: block;
    width: 100%;
    aspect-ratio: 3/4;
    object-fit: contain;
    border-radius: 10px
}

h2 {
    font-size: 15px;
    margin: 9px 0 0
}

article p {
    color: #586174;
    font-size: 12px;
    margin: 0
}

@media (max-width: 850px) {
    main {
        grid-template-columns:repeat(3, minmax(0, 1fr))
    }
}</style>
<header><h1>自媒体内置模板 · 12 套</h1>
