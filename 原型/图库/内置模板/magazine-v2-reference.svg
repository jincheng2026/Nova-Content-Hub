<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc"><title id="title">生活方式 · 原创换标题参考</title><desc id="desc">把普通一天过成新的发现。顶部小刊名与细线，字号小于标题。；左上宋体双行，正文不叠图。；右下抽象拱门，左侧竖排短句。。原创矢量参考，未经过 AI 还原测试。</desc><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="900" height="1200" fill="#f5f2e9" /><text x="66" y="96" font-size="24" fill="#262923" font-weight="500" >S L O W   N O T E S</text><path d="M66 124 L834 124" fill="none" stroke="#262923" stroke-width="2" /><text x="66" y="178" font-size="18" fill="#262923" font-weight="500" >ISSUE 06</text><text x="680" y="178" font-size="22" fill="#262923" font-weight="400" >生活练习</text><text x="66" y="300" font-size="86" fill="#262923" font-weight="500" font-family="Songti SC,SimSun,serif">把普通一天</text><text x="66" y="408" font-size="86" fill="#262923" font-weight="500" font-family="Songti SC,SimSun,serif">过成新的发现</text><text x="68" y="474" font-size="25" fill="#262923" font-weight="400" >从一个细节，重新认识生活</text><rect x="310" y="566" width="524" height="410" fill="#ded9ca" /><path d="M405 976 V760 A139 139 0 0 1 683 760 V976" fill="#b76345"/><path d="M470 976 V795 A73 73 0 0 1 616 795 V976" fill="#f5f2e9"/><circle cx="738" cy="640" r="42" fill="#f5f2e9"/><text x="66" y="708" font-size="40" fill="#262923" font-weight="500" font-family="Songti SC,SimSun,serif">留</text><text x="66" y="766" font-size="40" fill="#262923" font-weight="500" font-family="Songti SC,SimSun,serif">一</text><text x="66" y="824" font-size="40" fill="#262923" font-weight="500" font-family="Songti SC,SimSun,serif">点</text><text x="66" y="882" font-size="40" fill="#262923" font-weight="500" font-family="Songti SC,SimSun,serif">空</text><text x="66" y="1045" font-size="26" fill="#262923" font-weight="400" >写下一件今天才注意到的小事。</text><text x="66" y="1084" font-size="22" fill="#77746d" font-weight="400" >给日常一个新的观察角度。</text><text x="66" y="1160" font-size="16" fill="#26292