<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc"><title id="title">AI工具实测 · 原创设计原图</title><desc id="desc">同一个任务试试AI工具。上方双行任务，不声称测试结论。；中段深色试验台，一侧输入一侧输出。；底部记录观察位置，示例不是真实测试。。原创矢量参考，未经过 AI 还原测试。</desc><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="900" height="1200" fill="#e5eef0" /><text x="66" y="103" font-size="23" fill="#183b4d" font-weight="700" >AI TOOL LAB / 工具试验台</text><text x="66" y="238" font-size="82" fill="#183b4d" font-weight="750" >同一个任务</text><text x="66" y="342" font-size="82" fill="#183b4d" font-weight="750" >试试AI工具</text><text x="66" y="404" font-size="24" fill="#183b4d" font-weight="400" >试验台排版示意 · 不代表真实实测</text><rect x="66" y="474" width="768" height="431" fill="#183b4d" rx="18"/><text x="93" y="518" font-size="19" fill="#a5bfc8" font-weight="700" >INPUT</text><text x="488" y="518" font-size="19" fill="#a5bfc8" font-weight="700" >OUTPUT / 示意</text><path d="M450 541 L450 871" fill="none" stroke="#a5bfc8" stroke-width="2" /><rect x="91" y="552" width="333" height="299" fill="#f2f5f2" rx="10"/><text x="114" y="603" font-size="28" fill="#183b4d" font-weight="700" >任务卡</text><text x="114" y="651" font-size="24" fill="#183b4d" font-weight="400" >整理一段原始材料</text><text x="114" y="704" font-size="22" fill="#183b4d" font-weight="400" >目标 / 读者 / 格式</text><text x="114" y="795" font-size="21" fill="#183b4d" font-weight="600" >用户确认后输入</text><rect x="478" y="552" width="331" height="299" fill="#294c5e" rx="10"/><text x="502" y="604" font-size="28" fill="#ffffff" font-weight="700" >结果区域</text><rect x="502" y="655" width="242" height="9" fill="#a5bfc8" rx="4"/><rect x="502" y="690" width="206" height="9" fill="#a5bfc8" rx="4"/><rect x="502" y="725" width="170" height="9" fill="#a5bfc8" rx="4"/><text x="502" y="797" font-size="21" fill="#ffffff" font-weight="400" >此处不是真实输出</text><circle cx="81" cy="960" r="9" fill="#df7e4b"/><text x="107" y="969" font-size="27" fill="#183b4d" font-weight="600" >给出原始材料</text><circle cx="81" cy="1018" r="9" fill="#df7e4b"/><text x="107" y="1027" font-size="27" fill="#183b4d" font-weight="600" >保留完整输出</text><circle cx="81" cy="1076" r="9" fill="#df7e4b"/><text x="107" y="1085" font-size="27" fill="#183b4d" font-weight="600" >逐项人工核对</text><text x="66" y="1160" font-size="16" fill="#183b4d" font-weight="500" letter-spacing="1">原创设计原图 · NOVA CONTENT HUB</text></g></svg>
