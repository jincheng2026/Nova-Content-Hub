    - '!.editorconfig'
    - '!.yarnrc.yml'
  nodeModuleFilePatterns:
    - '**/*'
    - package.json
    - workbench/package.json
    - workbench/dist/**/*
    - plugin-src/src/lib/**/*
    - plugin-src/src/bridge/**/*
    - plugin-src/src/content.mjs
    - plugin-src/resources/**/*
    - plugin-src/references/**/*
    - plugin-src/schemas/**/*
    - '!**/{test,tests,__tests__,scripts,runtime,release}/**/*'
    - '!**/*{.test,.spec}.*'
    - '!**/*probe.mjs'
    - '!**/*.map'
    - '!**/.DS_Store'
    - '!package-lock.json'
