<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc"><title id="title">资讯速读 · 原创设计原图</title><desc id="desc">一条新消息先读懂背景。顶部简报栏明确内容示例。；左上双行短标题，不用虚构突发标签。；中下三行编号事实与左侧时间线。。原创矢量参考，未经过 AI 还原测试。</desc><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="0" y="0" width="900" height="1200" fill="#f6f3eb" /><text x="66" y="102" font-size="33" fill="#252b2b" font-weight="800" >THE DAILY BRIEF</text><text x="637" y="102" font-size="18" fill="#252b2b" font-weight="400" >资讯排版示例</text><path d="M66 128 L834 128" fill="none" stroke="#252b2b" stroke-width="2" /><text x="66" y="179" font-size="22" fill="#b94734" font-weight="700" >先核实，再表达 / 非真实事件</text><text x="66" y="292" font-size="82" fill="#252b2b" font-weight="750" >一条新消息</text><text x="66" y="396" font-size="82" fill="#252b2b" font-weight="750" >先读懂背景</text><text x="66" y="454" font-size="24" fill="#252b2b" font-weight="400" >这是资讯排版示例，不对应真实事件</text><path d="M104 565 L104 984" fill="none" stroke="#d9ded5" stroke-width="2" /><circle cx="104" cy="590" r="26" fill="#b94734"/><text x="91" y="598" font-size="24" fill="#f6f3eb" font-weight="800" >1</text><text x="161" y="596" font-size="36" fill="#252b2b" font-weight="700" >发生了什么</text><text x="161" y="640" font-size="23" fill="#252b2b" font-weight="400" >一句话交代已知信息</text><path d="M161 681 L834 681" fill="none" stroke="#d9ded5" stroke-width="2" /><circle cx="104" cy="759" r="26" fill="#b94734"/><text x="91" y="767" font-size="24" fill="#f6f3eb" font-weight="800" >2</text><text x="161" y="765" font-size="36" fill="#252b2b" font-weight="700" >依据在哪里</text><text x="161" y="809" font-size="23" fill="#252b2b" font-weight="400" >核对原始材料与发生时间</text><path d="M161 850 L834 850" fill="none" stroke="#d9ded5" stroke-width="2" /><circle cx="104" cy="928" r="26" fill="#b94734"/><text x="91" y="936" font-size="24" fill="#f6f3eb" font-weight="800" >3</text><text x="161" y="934" font-size="36" fill="#252b2b" font-weight="700" >后续看什么</text><text x="161" y="978" font-size="23" fill="#252b2b" font-weight="400" >区分事实、判断和待核问题</text><path d="M161 1019 L834 1019" fill="none" stroke="#d9ded5" stroke-width="2" /><rect x="66" y="1060" width="768" height="43" fill="#252b2b" /><text x="84" y="1089" font-size="21" fill="#f6f3eb" font-weight="500" >编辑提醒：这里不包含真实新闻或机构背书</text><text x="66" y="1160" font-size="16" fill="#252b2b" font-weight="500" letter-spacing="1">原创设计原图 · NOVA CONTENT HUB</text></g></svg>
