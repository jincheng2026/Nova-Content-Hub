<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>创作页 · 自媒体工作台</title>
<style>
:root{font:14px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro SC","SF Pro Text","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",Helvetica,Arial,sans-serif;color:#1D1D1F;background:#F5F5F7;--blue:#0071E3;--muted:#6E6E73;--line:rgba(0,0,0,.08)}*{box-sizing:border-box}body{margin:0}main{max-width:1440px;margin:auto;padding:18px 28px 32px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 26px;border-radius:24px;background:linear-gradient(135deg,#EDF3FB,#F7F9FC 60%,#FFF)}h1{font-size:24px;line-height:1.3;margin:0 0 8px}h2{font-size:15px;margin:0 0 12px}p{margin:8px 0}.muted{color:var(--muted)}.eyebrow{font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;min-height:36px;padding:5px 16px;border-radius:999px;border:1px solid var(--line);background:white;color:#1D1D1F;cursor:pointer}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button.primary:hover{background:#0066CC}button:disabled{cursor:default;opacity:.5}button:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #0071E3;outline-offset:3px}button[aria-pressed=true]{background:#E8F1FC;color:#005BB5}.columns{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.3fr);gap:20px;margin-top:20px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 1px 2px #0000000a,0 8px 24px #0000000d;min-width:0}.stack{display:grid;gap:16px;align-content:start}.prose{white-space:pre-wrap;overflow-wrap:anywhere}.entry{border-top:1px solid var(--line);padding:14px 0}.entry:first-child{border-top:0}textarea{display:block;resize:vertical;width:100%;min-height:150px;border:1px solid #8B8B90;border-radius:10px;background:#FAFAFC;color:inherit;font:inherit;padding:12px}#body{min-height:54vh;line-height:1.9}label{display:block;font-weight:600;margin-bottom:8px}summary{cursor:pointer;font-weight:600;padding:8px 0}blockquote{white-space:pre-wrap;border-left:3px solid #0071E3;padding-left:12px;margin:10px 0;overflow-wrap:anywhere}a{color:#0066CC;overflow-wrap:anywhere}#notice{padding:10px 14px;border-radius:10px;background:#E8F1FC;margin:16px 0}#notice.error{background:#FFECEB;color:#C0271D}#conflict{background:#FFF4E2;color:#7A4B00;margin:16px 0}#latest{background:white;color:#1D1D1F;padding:14px;max-height:40vh;overflow:auto}select{font:inherit;max-width:100%;min-height:36px;border:1px solid #8B8B90;background:#FAFAFC;border-radius:10px;padding:4px 8px}.status{font-size:13px;color:var(--muted)}.editor-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}input[type=radio]{accent-color:var(--blue)}.candidate{display:flex;align-items:flex-start;gap:8px;font-weight:400;padding:8px 0}.candidate span{white-space:pre-wrap;overflow-wrap:anywhere}.hint{font-size:13px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:800px){main{padding:16px}.columns{grid-template-columns:1fr}.card{padding:18px}header{padding:20px}#body{min-height:48vh}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
<header><div><div class="eyebrow muted">自媒体工作台 · 内容共创</div><h1 id="title">创作页</h1><div id="subtitle" class="muted">正在读取当前稿件…</div></div><div class="actions"><button id="reload" disabled>读取最新稿</button><button id="save" class="primary" disabled>保存修改</button></div></header>
<div id="notice" role="status" aria-live="polite">正在连接工作台…</div>
<section id="conflict" class="card" hidden aria-label="版本冲突"><h2>稿件已有新版本，你的输入仍保留</h2><p>请先复制保留当前输入，再读取最新稿并合并修改。此页不会用旧版本覆盖新稿。</p><details><summary>查看最新正文</summary><div id="latest" class="prose"></div></details></section>
<div class="columns">
<aside class="stack" aria-label="参考与叙事"><section class="card"><h2>参考资料</h2><div id="references" class="prose">正在读取…</div></section><section class="card"><h2>拆解与叙事</h2><details><summary>参考拆解</summary><div id="analysis" class="prose"></div></details><details open><summary>叙事方案</summary><div id="narrative" class="prose"></div></details></section></aside>
<div class="stack"><section class="card"><label for="body">我的稿件</label><textarea id="body" disabled spellcheck="false" aria-describedby="draft-status"></textarea><div class="editor-foot"><span id="draft-status" class="status">尚未载入</span><button id="confirm" disabled aria-pressed="false">确认当前内容</button></div></section><section class="card"><h2>逐句建议</h2><div id="suggestions"></div></section><section class="card"><h2>批注</h2><div id="annotations"></div><label for="annotation-quote">引用原句</label><textarea id="annotation-quote" rows="2" style="min-height:70px" placeholder="可选中稿件中的句子后点击下方按钮"></textarea><label for="annotation-text">我的批注</label><textarea id="annotation-text" rows="2" style="min-height:70px"></textarea><div class="actions" style="margin-top:12px"><button id="quote" disabled>引用选中句子</button><button id="add-annotation" disabled>加入批注</button></div></section><section class="card"><h2>标题、封面文字与简介</h2><p class="hint">分别选择；与正文一起显式保存。候选来自已验收产物。</p><div id="packaging"></div></section></div>
</div></main>
<script>
'use strict';
const $=id=>document.getElementById(id),base=window.novaCreation?.basePath;
let state=null,draft=null,dirty=false,busy=false,conflicted=false,revision=0;
const node=(tag,text,className)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(className)e.className=className;return e;};
function notice(text,error=false){$('notice').textContent=text;$('notice').className=error?'error':'';}
function controls(){for(const id of ['save','reload','confirm','quote','add-annotation'])$(id).disabled=busy||!state||id==='save'&&(!dirty||conflicted);$('body').disabled=busy||!state;for(const el of document.querySelectorAll('#suggestions button,#annotations button,#packaging input'))el.disabled=busy;}
function changed(){dirty=true;revision++;$('draft-status').textContent='有未保存修改';controls();}
async function hash(text){return [...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)))].map(x=>x.toString(16).padStart(2,'0')).join('');}
function renderReferences(){const box=$('references');box.replaceChildren();for(const r of draft.references){const section=node('details');section.append(node('summary',r.title||'未命名参考'));if(r.url){try{const url=new URL(r.url);if(['http:','https:'].includes(url.protocol)){const a=node('a','查看原始来源');a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';section.append(a);}}catch{}}for(const [label,text] of [['原识别稿',r.originalText],['校正版',r.correctedText],['参考拆解',r.analysis]]){const d=node('details');d.append(node('summary',label),node('div',text||'暂无内容','prose'));section.append(d);}if(r.segments?.length){const d=node('details');d.append(node('summary','时间码分段'));for(const s of r.segments)d.append(node('p',`${(s.startMs/1000).toFixed(1)}–${(s.endMs/1000).toFixed(1)} 秒  ${s.text}`));section.append(d);}box.append(section);}if(!draft.references.length)box.append(node('p','暂无参考，可在工作台继续找参考或按当前方向写稿。','muted'));$('analysis').textContent=draft.analysis||'暂无拆解';$('narrative').textContent=draft.narrative||'暂无叙事方案';}
function renderSuggestions(){const box=$('suggestions');box.replaceChildren();for(const s of draft.suggestions){const row=node('div',undefined,'entry');row.append(node('blockquote',s.quote),node('p',s.replacement),node('p',s.reason,'hint'));if(s.status==='pending'){const actions=node('div',undefined,'actions');for(const [label,accept]of[['采纳',true],['不采纳',false]]){const b=node('button',label);b.onclick=async()=>{if(busy)return;const body=$('body').value,version=revision;const bodyHash=await hash(body);if(revision!==version)return notice('稿件刚刚变化，请重新核对建议。',true);if(accept){if(s.bodyHash!==bodyHash||!s.quote||body.split(s.quote).length!==2)return notice('建议对应的原句已变化或出现多次，请先手动核对，原稿保留。',true);$('body').value=body.replace(s.quote,s.replacement);draft.confirmedBodyHash=null;}s.status=accept?'accepted':'rejected';changed();renderSuggestions();renderConfirmation();};actions.append(b);}row.append(actions);}else row.append(node('p',s.status==='accepted'?'已采纳 · 待保存':'不采纳 · 待保存','status'));box.append(row);}if(!draft.suggestions.length)box.append(node('p','暂无逐句建议。','muted'));controls();}
function renderAnnotations(){const box=$('annotations');box.replaceChildren();for(const a of draft.annotations){const row=node('div',undefined,'entry');row.append(node('blockquote',a.quote),node('p',a.text));if(a.status==='open'){const b=node('button','标记已处理');b.onclick=()=>{a.status='resolved';changed();renderAnnotations();};row.append(b);}else row.append(node('p','已处理','status'));box.append(row);}if(!draft.annotations.length)box.append(node('p','暂无批注。','muted'));controls();}
function renderPackaging(){const box=$('packaging');box.replaceChildren();for(const [key,label,selected]of[['titles','标题','selectedTitleId'],['coverTexts','封面文字','selectedCoverTextId'],['intros','简介','selectedIntroId']]){const section=node('details');section.append(node('summary',label));for(const c of draft.packaging[key]){const l=node('label',undefined,'candidate'),input=node('input');input.type='radio';input.name=key;input.checked=draft.packaging[selected]===c.id;input.onchange=()=>{draft.packaging[selected]=c.id;changed();};l.append(input,node('span',c.text));section.append(l);}if(!draft.packaging[key].length)section.append(node('p','暂无候选','muted'));box.append(section);}}
function renderConfirmation(){const confirmed=!!draft.confirmedBodyHash;$('confirm').textContent=confirmed?'当前内容已确认':'确认当前内容';$('confirm').setAttribute('aria-pressed',String(confirmed));}
function render(){document.title=`${state.content.title} · 创作页`;$('title').textContent=state.content.title||'创作页';$('subtitle').textContent=`${draft.tNumber} · 参考在左，当前稿件在右`;$('body').value=state.content.body;$('draft-status').textContent='已保存到工作台';renderReferences();renderSuggestions();renderAnnotations();renderPackaging();renderConfirmation();controls();}
async function request(route,options){const response=await fetch(base+route,{cache:'no-store',credentials:'omit',...options});const result=await response.json();if(!response.ok)throw Object.assign(new Error(result.error?.message||'请求未完成'),{code:result.error?.code,status:response.status});return result;}
async function load(){if(busy)return;if(dirty&&!window.confirm('当前有未保存修改，读取最新稿将替换本页输入。是否继续？'))return;busy=true;controls();try{const next=await request('/state');if(!next.creation)throw new Error('当前内容尚未建立创作信息，请回工作台开启创作。');state=next;draft=structuredClone(next.creation);dirty=false;conflicted=false;$('conflict').hidden=true;render();notice('已读取当前稿件。修改后请保存。');}catch(e){notice(e.message+'，当前输入保留。',true);}finally{busy=false;controls();}}
async function save(){if(busy||!state||conflicted||!dirty)return;busy=true;controls();const payload={body:$('body').value,editToken:state.content.editToken,bodyHash:state.content.bodyHash,productionToken:state.productionToken,creationPatch:{suggestions:draft.suggestions,annotations:draft.annotations,packaging:draft.packaging,confirmedBodyHash:draft.confirmedBodyHash}};try{const next=await request('/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});state=next;draft=structuredClone(next.creation);dirty=false;render();notice('修改已保存到工作台。');}catch(e){if(e.status===409||['CONFLICT','STALE_INPUT'].includes(e.code)){conflicted=true;$('conflict').hidden=false;try{$('latest').textContent=(await request('/state')).content.body;}catch{$('latest').textContent='暂时无法读取最新正文，请回工作台检查。';}notice('保存发生版本冲突，当前输入保留，请核对最新稿。',true);}else notice('保存未完成，当前输入保留。'+e.message,true);}finally{busy=false;controls();}}
$('body').addEventListener('input',()=>{if(!draft)return;draft.confirmedBodyHash=null;changed();renderConfirmation();});$('save').onclick=save;$('reload').onclick=load;$('confirm').onclick=async()=>{const version=revision,bodyHash=await hash($('body').value);if(version!==revision||busy)return;draft.confirmedBodyHash=draft.confirmedBodyHash?null:bodyHash;changed();renderConfirmation();};$('quote').onclick=()=>{$('annotation-quote').value=$('body').value.slice($('body').selectionStart,$('body').selectionEnd);$('annotation-text').focus();};$('add-annotation').onclick=async()=>{if(busy)return;const quote=$('annotation-quote').value,text=$('annotation-text').value.trim(),version=revision,body=$('body').value;if(!quote||!text||!body.includes(quote))return notice('请填写批注，并引用当前稿件中的原句。',true);const bodyHash=await hash(body);if(revision!==version||busy)return;draft.annotations.push({id:crypto.randomUUID(),bodyHash,quote,text,status:'open'});$('annotation-quote').value='';$('annotation-text').value='';changed();renderAnnotations();};window.addEventListener('beforeunload',e=>{if(dirty||$('annotation-text').value.trim()){e.preventDefault();e.returnValue='';}});if(typeof base==='string'&&/^\/p\/[a-f0-9]{64}$/.test(base))load();else notice('本页需要从工作台的“打开创作页”入口访问。',true);
</script>
</body>
</html>
